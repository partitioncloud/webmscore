name: Build webmscore

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - 'webmscore'
      - 'webmscore-*'
      - 'Xmader/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # See https://doc.qt.io/qt-6/wasm.html to have coherent Qt and EM versions
  # MuseScore 4.7 requires Qt >= 6.8, upstream builds wasm with Qt 6.10 / emsdk 4.0.7
  EM_VERSION: 4.0.7
  EM_CACHE_FOLDER: 'emsdk-cache'
  Qt6_VER: '6.10.2'
  COMMIT_MSG: ${{ github.event.head_commit.message }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compatibility step for act
        if: ${{ env.ACT }}
        run: |
          # If checkout is a `docker cp`, submodules are missing
          git submodule init
          git submodule update
          sudo apt update
          sudo apt install -y cmake
          cmake --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache/restore@v5
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}
      - uses: actions/cache@v5
        with:
          # Allows updating the cache
          # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          key: emmake_cache-${{ github.run_id }}
          restore-keys: |
            emmake_cache
          path: ${{ github.workspace }}/.ccache

      - name: Install Qt (host)
        # The host Qt provides the tools (moc, rcc, qmltyperegistrar) needed to cross compile
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.Qt6_VER}}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          archives: 'qtbase qtdeclarative qtsvg icu'
          modules: 'qt5compat'
          dir: ${{ github.workspace }}/build.qt6
          setup-python: true
          cache: true
      - name: Install Qt (wasm)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.Qt6_VER}}
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          archives: 'qtbase qtdeclarative qtsvg'
          modules: 'qt5compat'
          dir: ${{ github.workspace }}/build.qt6
          setup-python: true
          cache: true
      - name: Symlink libICU for Qt
        # This is an *awful* fix, but qmake seems to accept that
        run: |
          sudo ln -sf $(whereis libicui18n.so | awk '{print $NF}') $(whereis libicui18n.so | awk '{print $NF}').56
          sudo ln -sf $(whereis libicudata.so | awk '{print $NF}') $(whereis libicudata.so | awk '{print $NF}').56
          sudo ln -sf $(whereis libicuuc.so | awk '{print $NF}') $(whereis libicuuc.so | awk '{print $NF}').56

      - name: Install emscripten
        uses: Xmader/setup-emsdk@master
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Save Emscripten
        uses: actions/cache/save@v5
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}
      - name: Apply patches for Qt
        # Adds the prebuilt `offscreen` QPA platform plugin (webmscore runs headless)
        # and hides the `wasm` platform plugin, which requires a DOM
        run: |
          cp --verbose -r buildscripts/qt/* build.qt6/Qt/${Qt6_VER}/wasm_singlethread/
          find build.qt6/Qt/${Qt6_VER}/wasm_singlethread/lib/cmake/Qt6Gui/ -name 'Qt6QWasmIntegration*' -delete
      - name: Install ccache
        run: |
          sudo apt install -y ccache
          ccache --version

      - name: Build
        env:
          QT6_ROOT: ${{ github.workspace }}/build.qt6/Qt/${{env.Qt6_VER}}
        run: |
          cd web-public
          npm i
          npm run build:no-clean
          npm pack

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-pack
          path: web-public/webmscore4-*.tgz

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download webmscore package tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-pack
          path: web-example
      - name: Install
        run: |
          cd web-example
          npm i
          npm i ./webmscore4-*.tgz
      - name: Test
        run: |
          cd web-example
          npm run test:ci
      - name: Smoke test
        # also produces the exported files uploaded below
        id: run-test
        if: ${{ !cancelled() }}
        run: |
          cd web-example
          npm start || echo "failed=1" >> "$GITHUB_OUTPUT"
          npm run test-synth || echo "failed=1" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: web-example/junit.xml

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: example-exports
          path: web-example/exported*

      - uses: actions/upload-artifact@v7
        if: steps.run-test.outputs.failed == '1'
        with:
          name: test-log
          path: .npm/_logs

      - name: Make faile
        if: steps.run-test.outputs.failed == '1'
        run: |
          exit 1

  publish:
    if: github.ref_name == 'webmscore' && startsWith(github.event.head_commit.message, 'release v')

    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
          registry-url: https://registry.npmjs.org/
      - name: Download webmscore package tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-pack
      - run: |
          echo "VERSION=$(echo $COMMIT_MSG | cut -d ' ' -f 2)" >> $GITHUB_ENV
          echo $VERSION
      - name: Publish to Github Releases
        uses: softprops/action-gh-release@v3
        with:
          files: webmscore4-*.tgz
          name: webmscore ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
      - name: Publish to NPM
        run: npm publish webmscore4-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # npm_gUA5...
